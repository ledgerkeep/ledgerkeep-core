[workspace]
resolver = "2"
members = [
    "crates/maintainable",
    # Added in their respective build steps:
    # "contracts/registry",
    # "contracts/rent_vault",
    # "examples/long_escrow",
]

[workspace.dependencies]
soroban-sdk = "27.0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
